version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/rat-data/rat/platform/gen
plugins:
  # Go
  - remote: buf.build/protocolbuffers/go
    out: ../platform/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: ../platform/gen
    opt: paths=source_relative
  # Python — single shared codegen target: rat-protos (ADR-024 cleanup C).
  # Runner, ratq, and every plugin depend on this one package instead of vendoring
  # their own per-service gen/ copy. Pin protocolbuffers/python to v33.x so the
  # gencode targets the protobuf 6.33.x Python runtime we install (newer plugins
  # emit gencode for protobuf 7.x, which has no Python runtime on PyPI yet).
  - remote: buf.build/protocolbuffers/python:v33.0
    out: ../proto/sdk-python/src
  - remote: buf.build/grpc/python
    out: ../proto/sdk-python/src
  # TypeScript (SDK + portal)
  - remote: buf.build/connectrpc/es
    out: ../sdk-typescript/src/gen
    opt: target=ts
  - remote: buf.build/bufbuild/es
    out: ../sdk-typescript/src/gen
    opt: target=ts
