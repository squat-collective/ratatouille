[project]
name = "rat-format-iceberg"
version = "0.2.0b1"
description = "Iceberg format adapter for the rat-engine-duckdb plugin (ADR-024)"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "pyiceberg>=0.7",
    "s3fs>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.15.15", "pyright>=1.1"]

# Discovered by rat-engine-duckdb at startup. Production deployments pip-install
# this plugin; dev/E2E can use RAT_FORMAT_ADAPTERS=rat_format_iceberg.adapter:IcebergFormatAdapter.
[project.entry-points."rat_engine_duckdb.format_adapters"]
iceberg = "rat_format_iceberg.adapter:IcebergFormatAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rat_format_iceberg"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
