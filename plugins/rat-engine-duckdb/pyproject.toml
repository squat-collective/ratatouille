[project]
name = "rat-engine-duckdb"
version = "0.2.0b1"
description = "DuckDB compute engine (engine/v1) for the RAT decoupled data architecture"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "grpcio>=1.65",
    "protobuf>=5.27",
    # Format-specific heavy deps (pyiceberg, s3fs, etc.) live in the format
    # plugins (rat-format-iceberg, rat-format-ducklake) discovered at startup.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.15.15",
    "pyright>=1.1",
    "grpcio-tools>=1.65",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rat_engine_duckdb"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/rat_engine_duckdb/gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
