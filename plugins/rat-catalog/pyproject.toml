[project]
name = "rat-catalog"
version = "0.2.0b1"
description = "Protocol-aware catalog axis (catalog/v1) for RAT's decoupled data architecture (ADR-024)"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.65",
    "protobuf>=5.27",
    "pyiceberg>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.15.15", "pyright>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rat_catalog"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/rat_catalog/gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
