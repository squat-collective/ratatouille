[project]
name = "rat-catalog-ducklake"
version = "0.2.0b1"
description = "DuckLake catalog/v1 service for the RAT decoupled data architecture"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.65",
    "protobuf>=5.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.15.15", "pyright>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rat_catalog_ducklake"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
